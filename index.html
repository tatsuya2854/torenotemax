function openFromHash(){
  let h = "";
  try{ h = decodeURIComponent((location.hash||"").replace(/^#/,"")); }catch(e){ h = (location.hash||"").replace(/^#/,""); }
  if(!h) return false;

  const params = {};
  h.split("&").forEach(kv=>{
    const i = kv.indexOf("=");
    if(i>0) params[kv.slice(0,i)] = kv.slice(i+1);
  });
  /* 短縮コード方式（#m=f12）：店舗記号＋プリセットの並び順。QRを小さく保つため */
  if(params.m && !params.ex){
    const code = String(params.m);
    const sid = code[0]==="y" ? "yoshizuka" : "futamatase";
    const idx = parseInt(code.slice(1),10);
    const table = QR_ORDER[sid] || [];
    const wantName = (!isNaN(idx) && idx>=1) ? table[idx-1] : null;
    if(wantName){
      const st = (state.stores||[]).find(x=> x.id===sid);
      if(st) state.ui.storeId = st.id;
      const nn = norm(wantName);
      const hitM = state.exercises.find(e=> inStore(e, sid) && norm(e.name)===nn)
                || state.exercises.find(e=> norm(e.name)===nn);
      if(hitM){
        if(!inStore(hitM) && Array.isArray(hitM.stores) && hitM.stores.length) state.ui.storeId = hitM.stores[0];
        state.ui.currentExId = hitM.id;
        state.ui.currentArea = hitM.cat;
        state.ui.q = "";
        save();
        return true;
      }
    }
  }

  const want = params.ex || params.e;
  if(!want) return false;

  const nq = norm(want);
  /* 店舗指定があればその店舗を優先。無ければ現在の店舗 → 全店舗の順で探す */
  if(params.store){
    const st = (state.stores||[]).find(s=> norm(s.name)===norm(params.store) || s.id===params.store);
    if(st) state.ui.storeId = st.id;
  }
  let hit = state.exercises.find(e=> inStore(e) && norm(e.name)===nq)
         || state.exercises.find(e=> norm(e.name)===nq)
         || state.exercises.find(e=> inStore(e) && norm(e.name).indexOf(nq)>=0)
         || state.exercises.find(e=> norm(e.name).indexOf(nq)>=0);

  if(!hit) return false;

  /* その種目がある店舗に自動で切り替える */
  if(!inStore(hit) && Array.isArray(hit.stores) && hit.stores.length){
    state.ui.storeId = hit.stores[0];
  }
  state.ui.currentExId = hit.id;
  state.ui.currentArea = hit.cat;
  state.ui.q = "";
  save();
  return true;
}

function renderChips(){
  document.getElementById("store-name").textContent = storeName(curStore()) || "店舗";
  const pool  = storeExercises();
  const q     = (state.ui.q||"").trim();
  const res   = document.getElementById("search-results");
  const sel   = document.getElementById("ex-select");
  document.getElementById("s-clear").style.display = q ? "grid" : "none";

  /* --- 検索中：現在の店舗の全エリアから探す --- */
  if(q){
    sel.style.display="none"; res.style.display="block";
    const nq = norm(q);
    const hits = pool.filter(e=> norm(e.name).indexOf(nq) >= 0);
    res.innerHTML = "";
    if(!hits.length){
      const em = document.createElement("div");
      em.className = "sr-empty";
      em.textContent = storeName(curStore())+"に一致する種目がありません";
      const mk = document.createElement("button");
      mk.className = "sr-add"; mk.textContent = "「"+q+"」を新しい種目として追加";
      mk.onclick = ()=> openExerciseSheet(null, q);
      res.appendChild(em); res.appendChild(mk);
      return;
    }
    hits.slice(0,40).forEach(ex=>{
      const b = document.createElement("button");
      b.className = "sr-item" + (ex.id===state.ui.currentExId ? " active":"");
      const nm = document.createElement("span"); nm.className="sr-name"; nm.textContent = exName(ex.name);
      const ar = document.createElement("span"); ar.className="sr-area"; ar.textContent = areaName(ex.cat);
      b.appendChild(nm); b.appendChild(ar);
      b.onclick = ()=> selectExercise(ex.id);
      res.appendChild(b);
    });
    return;
  }

  /* --- 通常表示：選択中の種目をボタンに出すだけ（一覧はタップで開く） --- */
  res.style.display="none"; sel.style.display="flex";
  const cur = state.exercises.find(e=> e.id === state.ui.currentExId);
  if(cur && state.ui.currentArea!=="recent") state.ui.currentArea = cur.cat;
  document.getElementById("es-name").textContent = cur ? exName(cur.name) : t("x","種目を選ぶ","Select exercise");
  document.getElementById("es-area").textContent = cur ? areaName(cur.cat) : "";
}

/* ============================================================
   種目ピッカー（縦スクロールの一覧。横スクロールをやめた）
   ============================================================ */
function openExercisePicker(){
  const recents = recentExercises();
  if(!state.ui.pickArea || (state.ui.pickArea==="recent" && !recents.length)){
    const cur = state.exercises.find(e=> e.id===state.ui.currentExId);
    state.ui.pickArea = cur ? cur.cat : AREAS[0].id;
  }
  renderPicker(); showSheet();
}
function renderPicker(){
  const sheet = document.getElementById("sheet");
  const pool = storeExercises();
  const recents = recentExercises();
  const area = state.ui.pickArea;
  const byPart = state.ui.pickBy === "part";

  const tabs = (recents.length ? [{id:"recent", name:"最近", n:recents.length}] : [])
    .concat(AREAS.map(a=> ({id:a.id, name:a.name, n:pool.filter(e=> e.cat===a.id).length})));

  sheet.innerHTML =
    '<h2>種目を選ぶ</h2>'+
    '<div class="mtabs pk-mode">'+
      '<button class="mtab'+(byPart?"":" active")+'" data-by="area">'+t("x","器具で選ぶ","By equipment")+'</button>'+
      '<button class="mtab'+(byPart?" active":"")+'" data-by="part">'+t("x","部位で選ぶ","By muscle")+'</button>'+
    '</div>'+
    '<div class="area-tabs" id="pick-tabs"></div>'+
    '<div class="picker-list" id="pick-list"></div>'+
    '<button class="sr-add" id="pick-add">＋ 種目を追加</button>'+
    '<div class="sheet-btns"><button class="btn ghost" id="pick-close">閉じる</button></div>';
  sheet.querySelectorAll(".pk-mode .mtab").forEach(b=>{
    b.onclick = ()=>{ state.ui.pickBy = b.dataset.by; save(); renderPicker(); };
  });

  const tabWrap = document.getElementById("pick-tabs");
  if(byPart){
    /* 部位タブ：6部位＋有酸素と、よく使う組み合わせ */
    const sel = state.ui.pickPart || "chest";
    const defs = PARTS.map(p=> ({id:p.id, name:partLabel(p.id), parts:[p.id], single:true}))
      .concat(PART_COMBOS.map(c=> ({id:"c:"+c.id, name:(LANG==="en"?c.en:c.ja), parts:c.parts})));
    defs.forEach(d=>{
      const n = d.single
        ? exercisesByPart(d.id, pool).main.length
        : pool.filter(e=> d.parts.indexOf(mainPart(e))>=0).length;
      if(!n) return;
      const b = document.createElement("button");
      b.className = "area-tab" + (d.id===sel ? " active":"");
      b.innerHTML = d.name + '<span class="area-n">'+n+'</span>';
      b.onclick = ()=>{ state.ui.pickPart = d.id; save(); renderPicker(); };
      tabWrap.appendChild(b);
    });

    const cur = defs.find(d=> d.id===sel) || defs[0];
    const list = document.getElementById("pick-list");
    list.innerHTML = "";

    const addItem = (ex, sub)=>{
      const b = document.createElement("button");
      b.className = "pick-item" + (ex.id===state.ui.currentExId ? " active":"");
      const nm = document.createElement("span"); nm.className="pick-name"; nm.textContent = exName(ex.name);
      b.appendChild(nm);
      const tag = document.createElement("span"); tag.className="sr-area";
      tag.textContent = sub ? t("x","補助","also") : partLabel(mainPart(ex));
      b.appendChild(tag);
      b.onclick = ()=>{
        state.ui.currentExId = ex.id; state.ui.currentArea = ex.cat;
        save(); hideSheet(); renderTrain();
      };
      list.appendChild(b);
    };
    const label = (txtJa, txtEn)=>{
      const d=document.createElement("div"); d.className="pick-sec";
      d.textContent = t("x", txtJa, txtEn); list.appendChild(d);
    };

    if(cur.single){
      const {main, sub} = exercisesByPart(cur.id, pool);
      if(main.length){ label(partLabel(cur.id)+"がメインの種目", "Main for "+partLabel(cur.id)); main.forEach(e=> addItem(e,false)); }
      if(sub.length){ label("この部位も使う種目", "Also works this area"); sub.forEach(e=> addItem(e,true)); }
      if(!main.length && !sub.length) list.innerHTML = '<div class="sr-empty">'+t("x","この部位の種目がありません","No exercises for this muscle")+'</div>';
    }else{
      cur.parts.forEach(pid=>{
        const {main} = exercisesByPart(pid, pool);
        if(!main.length) return;
        label(partLabel(pid), partLabel(pid));
        main.forEach(e=> addItem(e,false));
      });
    }
    document.getElementById("pick-add").onclick = ()=> openExerciseSheet(null);
    document.getElementById("pick-close").onclick = hideSheet;
    localize(sheet);
    return;
  }
  tabs.forEach(a=>{
    const b = document.createElement("button");
    b.className = "area-tab" + (a.id===area ? " active":"");
    b.innerHTML = a.name + '<span class="area-n">'+a.n+'</span>';
    b.onclick = ()=>{ state.ui.pickArea = a.id; renderPicker(); };
    tabWrap.appendChild(b);
  });

  const list = document.getElementById("pick-list");
  const items = area==="recent" ? recents : pool.filter(e=> e.cat===area);
  if(!items.length){
    list.innerHTML = '<div class="sr-empty">このエリアに種目がありません</div>';
  }else{
    items.forEach(ex=>{
      const done = (state.sessions[ex.id]||[]).some(hasData);
      const b = document.createElement("button");
      b.className = "pick-item" + (ex.id===state.ui.currentExId ? " active":"");
      const nm = document.createElement("span"); nm.className="pick-name"; nm.textContent = exName(ex.name);
      b.appendChild(nm);
      if(area==="recent"){
        const ar=document.createElement("span"); ar.className="sr-area"; ar.textContent=areaName(ex.cat);
        b.appendChild(ar);
      }else if(done){
        const d=document.createElement("span"); d.className="pick-dot"; b.appendChild(d);
      }
      b.onclick = ()=>{
        state.ui.currentExId = ex.id;
        if(area!=="recent") state.ui.currentArea = ex.cat;
        save(); hideSheet(); renderTrain();
      };
      list.appendChild(b);
    });
  }
  document.getElementById("pick-add").onclick = ()=> openExerciseSheet(null);
  document.getElementById("pick-close").onclick = hideSheet;
}

function renderTrainBody(){
  const body = document.getElementById("train-body");
  const ex = state.exercises.find(e=> e.id === state.ui.currentExId);
  body.innerHTML = "";
  if(!ex){
    body.innerHTML = '<div class="empty-ex"><div class="big">▦</div>種目を追加してください</div>';
    return;
  }
  const prev = prevSession(ex.id);
  const today = ensureTodaySession(ex.id);

  const card = document.createElement("div");
  card.className = "card";

  /* 種目ヘッダ */
  const head = document.createElement("div");
  head.className = "ex-head";
  head.innerHTML = '<span class="name"></span><div class="tools">'+
    '<button class="icon-btn" data-act="edit">✎</button></div>';
  head.querySelector(".name").textContent = exName(ex.name);
  head.querySelector('[data-act="edit"]').onclick = ()=> openExerciseSheet(ex);
  card.appendChild(head);

  if(ex.cat === "cardio"){
    buildCardioCard(card, ex, prev, today);
    buildMemo(card, ex.id, prev, today);
    body.appendChild(card);
    buildTodayList(body, ex.id);
    return;
  }

  /* マシンの参考写真 */

  /* 前回の記録 */
  const ref = document.createElement("div");
  ref.className = "prev-ref";
  if(prev && prev.sets && prev.sets.length){
    const best = prev.sets.reduce((a,b)=> (b.w||0)>(a.w||0)?b:a, prev.sets[0]);
    let sets = prev.sets.map(s=> '<span class="pset'+((s===best)?" top":"")+'"><b>'+fmtNum(s.w)+'</b>kg × <b>'+s.r+'</b></span>').join("");
    ref.innerHTML = '<div class="label"><span>前回の記録</span><span>'+fmtDate(prev.date)+'</span></div>'+
                    '<div class="sets">'+sets+'</div>';
  }else{
    ref.innerHTML = '<div class="label"><span>前回の記録</span></div><div class="prev-empty">まだ記録がありません。今日が1回目です。</div>';
  }
  const hb = document.createElement("button");
  hb.className = "hist-btn";
  hb.innerHTML = '<span>📈 これまでの記録を見る</span><span class="hb-c">›</span>';
  hb.onclick = ()=> openHistory(ex.id);
  ref.appendChild(hb);
  card.appendChild(ref);

  /* 今日のセット */
  const tl = document.createElement("div");
  tl.className = "today-label";
  tl.textContent = (viewDate===todayStr() ? "今日" : fmtDate(viewDate)) + " — セットを記録";
  card.appendChild(tl);

  const sets = today.sets || (today.sets = []);
  sets.forEach((set,i)=>{
    card.appendChild(buildSetRow(ex.id, set, i, prev && prev.sets ? prev.sets[i] : null));
  });

  const addBtn = document.createElement("button");
  addBtn.className = "add-set";
  addBtn.innerHTML = "＋ セットを追加";
  addBtn.onclick = ()=>{
    const t = ensureTodaySession(ex.id);
    if(!t.sets) t.sets = [];
    const idx  = t.sets.length;
    const last = t.sets[idx-1];
    /* 重量はセット間・日をまたいでも引き継ぐ／回数は毎回リセット
       1セット目は前回の同じセット番号（無ければ前回の最終セット）の重量を持ってくる */
    let w = null;
    if(carryWeightOn()){
      if(last && last.w != null) w = last.w;
      else{
        const pv = prevSession(ex.id);
        const ps = pv && pv.sets ? pv.sets : null;
        if(ps && ps.length){
          const src = ps[idx] || ps[ps.length-1];
          if(src && src.w != null) w = src.w;
        }
      }
    }
    t.sets.push({w: w, r:null});
    save(); renderTrainBody();
  };
  card.appendChild(addBtn);
  buildMemo(card, ex.id, prev, today);

  body.appendChild(card);
  buildTodayList(body, ex.id);
}

/* ============================================================
   その日にやったことの一覧
   （種目を1つずつ開かないと分からなかったので、まとめて縦に並べる）
   ============================================================ */
function todayDone(){
  const out = [];
  state.exercises.forEach(ex=>{
    const s = (state.sessions[ex.id]||[]).find(x=> x.date === viewDate);
    if(s && hasData(s)) out.push({ex, s});
  });
  out.sort((a,b)=> (a.s.t||0) - (b.s.t||0));   // 記録した順
  return out;
}
function buildTodayList(body, currentId){
  const done = todayDone();
  const wrap = document.createElement("div");
  wrap.className = "card today-card";

  const isToday = (viewDate === todayStr());
  const head = document.createElement("div");
  head.className = "today-head";
  head.innerHTML = '<span class="th-t">'+(isToday? t("x","今日やったこと","Today\u0027s session") : fmtDate(viewDate)+t("x"," の記録"," session"))+'</span>';
  wrap.appendChild(head);

  if(!done.length){
    const em = document.createElement("div");
    em.className = "today-empty";
    em.textContent = "まだ記録がありません。上で重量と回数を入れると、ここに並びます。";
    wrap.appendChild(em);
    body.appendChild(wrap);
    return;
  }

  /* 合計（重量×回数の総量は、やった量の目安になる） */
  let sets = 0, vol = 0, cardioMin = 0;
  done.forEach(({s})=>{
    (s.sets||[]).forEach(x=>{
      if(x && x.w!=null && x.r!=null){ sets++; vol += x.w*x.r; }
    });
    if(s.cardio && s.cardio.min!=null) cardioMin += s.cardio.min;
  });
  /* 鍛えた部位をひと目で（例：胸・三頭筋） */
  const trained = partsTrained(viewDate);
  if(trained.length){
    const pw = document.createElement("div");
    pw.className = "part-chips";
    trained.forEach(pid=>{
      const c = document.createElement("span");
      c.className = "part-chip";
      c.textContent = partLabel(pid);
      pw.appendChild(c);
    });
    wrap.appendChild(pw);
  }

  const sum = document.createElement("div");
  sum.className = "today-sum";
  let parts = [done.length + t("x","種目"," exercises")];
  if(sets) parts.push(sets + t("x","セット"," sets"));
  if(vol)  parts.push(t("x","総重量 ","Volume ")+Math.round(vol).toLocaleString()+"kg");
  if(cardioMin) parts.push(t("x","有酸素 ","Cardio ")+Math.round(cardioMin)+t("x","分"," min"));
  sum.textContent = parts.join("　/　");
  wrap.appendChild(sum);

  done.forEach(({ex, s})=>{
    const row = document.createElement("button");
    row.className = "tdo" + (ex.id===currentId ? " now" : "");
    const nm = document.createElement("div");
    nm.className = "tdo-n";
    nm.textContent = exName(ex.name);
    row.appendChild(nm);

    const det = document.createElement("div");
    det.className = "tdo-d";
    if(ex.cat === "cardio" && s.cardio){
      const c = s.cardio, bits = [];
      if(c.min!=null)  bits.push(c.min+"分");
      if(c.dist!=null) bits.push(c.dist+"km");
      if(c.kcal!=null) bits.push(c.kcal+"kcal");
      if(c.hr!=null)   bits.push(c.hr+"bpm");
      det.textContent = bits.join("　");
    }else{
      const valid = (s.sets||[]).filter(x=> x && x.w!=null && x.r!=null);
      det.innerHTML = valid.map(x=> '<span class="tdo-s"><b>'+fmtNum(x.w)+'</b>×'+x.r+'</span>').join("");
      if(!valid.length) det.textContent = "（記録なし）";
    }
    row.appendChild(det);

    if(s.memo && s.memo.trim()){
      const mm = document.createElement("div");
      mm.className = "tdo-m";
      mm.textContent = s.memo.trim();
      row.appendChild(mm);
    }
    row.onclick = ()=>{
      state.ui.currentExId = ex.id;
      state.ui.currentArea = ex.cat;
      if(!inStore(ex) && Array.isArray(ex.stores) && ex.stores.length) state.ui.storeId = ex.stores[0];
      save(); renderTrain();
      window.scrollTo({top:0, behavior:"smooth"});
    };
    wrap.appendChild(row);
  });

  body.appendChild(wrap);
}

/* ---------- 感覚メモ（その日の種目ごとに残す） ---------- */
function buildMemo(card, exId, prev, today){
  /* 前回のメモがあれば先に見せる（前回の感覚を思い出してから入力できる） */
  if(prev && prev.memo && prev.memo.trim()){
    const pm = document.createElement("div");
    pm.className = "memo-prev";
    const lb = document.createElement("div");
    lb.className = "memo-prev-l"; lb.textContent = "前回のメモ（"+fmtDate(prev.date)+"）";
    const tx = document.createElement("div");
    tx.className = "memo-prev-t"; tx.textContent = prev.memo;
    pm.appendChild(lb); pm.appendChild(tx);
    card.appendChild(pm);
  }

  const lab = document.createElement("div");
  lab.className = "today-label";
  lab.textContent = "メモ — 今日の感覚";
  card.appendChild(lab);

  const ta = document.createElement("textarea");
  ta.className = "memo-input";
  ta.rows = 2;
  ta.placeholder = "例：肩に効いた／重すぎた／フォームが安定してきた";
  ta.value = today.memo || "";
  function grow(){ ta.style.height="auto"; ta.style.height = Math.max(56, ta.scrollHeight)+"px"; }
  let tmr=null;
  ta.addEventListener("input", ()=>{
    grow();
    clearTimeout(tmr);
    tmr = setTimeout(()=>{
      const t = ensureTodaySession(exId);
      t.memo = ta.value;
      t.t = Date.now();
      save();
    }, 400);
  });
  ta.addEventListener("blur", ()=>{
    const t = ensureTodaySession(exId);
    t.memo = ta.value; save();
  });
  card.appendChild(ta);
  setTimeout(grow, 0);
}

/* ---------- 有酸素カード ---------- */
const CARDIO_FIELDS = [
  {key:"min",  label:"時間",   unit:"分",   step:1,  dec:false},
  {key:"dist", label:"距離",   unit:"km",  step:0.1,dec:true},
  {key:"kcal", label:"消費カロリー", unit:"kcal", step:10, dec:false},
  {key:"hr",   label:"心拍数", unit:"bpm", step:1,  dec:false},
];
function buildCardioCard(card, ex, prev, today){
  if(!today.cardio) today.cardio = {min:null,dist:null,kcal:null,hr:null};
  const c = today.cardio;
  const pc = prev && prev.cardio ? prev.cardio : null;

  /* 前回の記録 */
  const ref = document.createElement("div");
  ref.className = "prev-ref";
  if(pc && (pc.min||pc.dist||pc.kcal||pc.hr)){
    ref.innerHTML = '<div class="label"><span>前回の記録</span><span>'+fmtDate(prev.date)+'</span></div>'+
      '<div class="sets">'+
        '<span class="pset"><b>'+fmtC(pc.min)+'</b>分</span>'+
        '<span class="pset"><b>'+fmtC(pc.dist)+'</b>km</span>'+
        '<span class="pset"><b>'+fmtC(pc.kcal)+'</b>kcal</span>'+
        '<span class="pset"><b>'+fmtC(pc.hr)+'</b>bpm</span>'+
      '</div>';
  }else{
    ref.innerHTML = '<div class="label"><span>前回の記録</span></div><div class="prev-empty">まだ記録がありません。今日が1回目です。</div>';
  }
  card.appendChild(ref);

  const tl = document.createElement("div");
  tl.className = "today-label";
  tl.textContent = (viewDate===todayStr() ? "今日" : fmtDate(viewDate)) + " — 記録";
  card.appendChild(tl);

  CARDIO_FIELDS.forEach(f=>{
    const row = document.createElement("div");
    row.className = "cardio-row";
    const lab = document.createElement("div");
    lab.className = "cardio-lab"; lab.textContent = f.label;
    row.appendChild(lab);
    const field = fieldNum({
      value:c[f.key], placeholder: pc && pc[f.key]!=null ? String(pc[f.key]) : f.unit,
      unit:f.unit, step:f.step, decimal:f.dec,
      onChange:(v)=>{ c[f.key]=v; today.t = Date.now(); save(); }
    });
    field.dataset.k = f.key;
    row.appendChild(field);
    card.appendChild(row);
  });
}
function fmtC(v){ return v==null ? "–" : v; }

/* ---------- マシンの参考写真 ---------- */

function fmtNum(n){
  if(n==null) return "–";
  return Number.isInteger(n) ? String(n) : String(n);
}

function buildSetRow(exId, set, idx, prevSet){
  const row = document.createElement("div");
  row.className = "set";
  const pr = isPR(set, prevSet);
  if(pr) row.classList.add("pr");

  /* index */
  const si = document.createElement("div");
  si.className = "set-idx num";
  si.textContent = idx+1;
  row.appendChild(si);

  /* weight field */
  const wf = fieldNum({
    value:set.w, placeholder: prevSet? fmtNum(prevSet.w):"kg", unit:"kg", step:WEIGHT_STEP, decimal:true,
    onChange:(v)=>{ set.w = v; commitSet(exId,idx,set); }
  });
  if(pr){ const b=document.createElement("div"); b.className="pr-badge"; b.textContent="更新！"; wf.appendChild(b); }
  row.appendChild(wf);

  /* reps field */
  const rf = fieldNum({
    value:set.r, placeholder: prevSet? String(prevSet.r):"回", unit:"回", step:REPS_STEP, decimal:false,
    onChange:(v)=>{ set.r = v; commitSet(exId,idx,set); }
  });
  row.appendChild(rf);

  /* delete */
  const del = document.createElement("button");
  del.className = "set-del";
  del.textContent = "×";
  del.onclick = ()=>{
    const t = ensureTodaySession(exId);
    t.sets.splice(idx,1);
    save(); renderTrainBody();
  };
  row.appendChild(del);

  return row;
}

function fieldNum({value, placeholder, unit, step, decimal, onChange}){
  /* タップすると縦スクロールの一覧が開く。一覧内から手入力もできる */
  const f = document.createElement("button");
  f.type = "button";
  f.className = "field";

  let cur = (value!=null) ? value : null;

  const valrow = document.createElement("div");
  valrow.className = "valrow";
  const val = document.createElement("span");
  val.className = "val num";
  const u = document.createElement("span"); u.className="unit"; u.textContent = unit;
  valrow.appendChild(val); valrow.appendChild(u);

  const hint = document.createElement("span");
  hint.className = "field-hint";

  function paint(){
    if(cur!=null){ val.textContent = decimal ? cur : Math.round(cur); val.classList.remove("ph"); }
    else{ val.textContent = (placeholder && !isNaN(parseFloat(placeholder))) ? placeholder : "–"; val.classList.add("ph"); }
    /* 「142.5」のような長い数字でも末尾が切れないよう、桁数で文字サイズを落とす */
    const n = val.textContent.length;
    val.classList.remove("d4","d5");
    if(n>=5) val.classList.add("d5");
    else if(n===4) val.classList.add("d4");
    hint.textContent = (cur!=null) ? "タップで変更" : (placeholder && !isNaN(parseFloat(placeholder)) ? "前回の値" : "タップで入力");
  }
  paint();

  f.onclick = ()=>{
    openNumberWheel({
      title: unit==="kg" ? "重量を選ぶ" : (unit==="回" ? "回数を選ぶ" : unit+"を選ぶ"),
      unit, decimal, step,
      current: cur,
      suggest: parseFloat(placeholder),
      onPick:(v)=>{ cur = v; paint(); onChange(v); }
    });
  };

  f.appendChild(valrow); f.appendChild(hint);
  return f;
}

/* ============================================================
   種目ごとの履歴（月単位の推移＋過去の全記録）
   ============================================================ */
function e1rm(w, r){                     // 推定1RM（Epley式）: 重量×回数を1つの指標にまとめる
  if(!w || !r) return 0;
  return w * (1 + r/30);
}
function sessionStats(s){
  const sets = (s.sets||[]).filter(x=> x && x.w!=null && x.r!=null);
  if(!sets.length) return null;
  let maxW=0, vol=0, best=0;
  sets.forEach(x=>{
    if(x.w>maxW) maxW=x.w;
    vol += x.w * x.r;
    const e = e1rm(x.w, x.r);
    if(e>best) best=e;
  });
  return {maxW, vol, e1rm:Math.round(best*10)/10, sets:sets.length};
}

function openHistory(exId){
  state.ui.histMode = state.ui.histMode || "e1rm";
  renderHistory(exId);
  showSheet();
}
function renderHistory(exId){
  const ex = state.exercises.find(e=> e.id===exId);
  const sheet = document.getElementById("sheet");
  const all = sessionsOf(exId).filter(hasData).filter(s=> (s.sets||[]).some(x=>x&&x.w!=null&&x.r!=null));
  const mode = state.ui.histMode;

  if(!all.length){
    sheet.innerHTML = '<h2>これまでの記録</h2><div class="sr-empty">まだ記録がありません</div>'+
      '<div class="sheet-btns"><button class="btn ghost" id="h-close">閉じる</button></div>';
    showSheet();
    document.getElementById("h-close").onclick = hideSheet;
    return;
  }

  /* 月ごとにまとめる（その月のベスト値） */
  const months = {};
  all.forEach(s=>{
    const st = sessionStats(s); if(!st) return;
    const k = s.date.slice(0,7);
    if(!months[k]) months[k] = {maxW:0, vol:0, e1rm:0, days:0};
    const m = months[k];
    m.days++;
    if(st.maxW>m.maxW) m.maxW=st.maxW;
    if(st.e1rm>m.e1rm) m.e1rm=st.e1rm;
    m.vol += st.vol;
  });
  const mKeys = Object.keys(months).sort().slice(-12);

  const MODES = [
    {id:"e1rm", name:"推定1RM", unit:"kg"},
    {id:"maxW", name:"最大重量", unit:"kg"},
    {id:"vol",  name:"総ボリューム", unit:"kg"},
  ];
  const cur = MODES.find(m=> m.id===mode) || MODES[0];

  /* 全体のベスト記録 */
  let allBest = {e1rm:0, maxW:0, date:"", w:0, r:0};
  all.forEach(s=>{
    (s.sets||[]).forEach(x=>{
      if(!x || x.w==null || x.r==null) return;
      const e = e1rm(x.w, x.r);
      if(e > allBest.e1rm){ allBest = {e1rm:Math.round(e*10)/10, maxW:x.w, date:s.date, w:x.w, r:x.r}; }
    });
  });

  /* 直近と最初の比較 */
  const firstK = mKeys[0], lastK = mKeys[mKeys.length-1];
  const dv = months[lastK][mode] - months[firstK][mode];
  const dvTxt = (dv>0?"+":"") + (Math.round(dv*10)/10);

  sheet.innerHTML =
    '<h2>'+escapeHtml(ex?ex.name:"記録")+'</h2>'+
    '<div class="hist-best">'+
      '<div class="hb-l">自己ベスト</div>'+
      '<div class="hb-v num">'+allBest.w+'<span class="hb-u">kg</span> × '+allBest.r+'<span class="hb-u">回</span></div>'+
      '<div class="hb-d">'+fmtDateFull(allBest.date)+'　推定1RM '+allBest.e1rm+'kg</div>'+
    '</div>'+
    '<div class="wmode" id="hist-mode">'+
      MODES.map(m=> '<button class="wmode-btn'+(m.id===mode?" active":"")+'" data-m="'+m.id+'">'+m.name+'</button>').join("")+
    '</div>'+
    '<div class="hist-sum">'+
      '<span>月ごとの'+cur.name+'</span>'+
      '<span class="hs-d '+(dv>0?"up":(dv<0?"down":""))+'">'+(mKeys.length>1? dvTxt+cur.unit : "")+'</span>'+
    '</div>'+
    '<div class="hist-chart" id="hist-chart"></div>'+
    '<div class="pill-label">記録の一覧（新しい順）</div>'+
    '<div class="hist-list" id="hist-list"></div>'+
    '<div class="sheet-btns"><button class="btn ghost" id="h-close">閉じる</button></div>';

  /* 棒グラフ */
  const cw = document.getElementById("hist-chart");
  const vals = mKeys.map(k=> months[k][mode]);
  const max = Math.max(...vals, 1);
  let bars = "";
  mKeys.forEach((k,i)=>{
    const v = vals[i];
    const h = Math.max(3, Math.round(v/max*100));
    const isLast = i===mKeys.length-1;
    bars += '<div class="hbar">'+
      '<div class="hbar-v num">'+(v>=1000? Math.round(v/100)/10+"k" : Math.round(v*10)/10)+'</div>'+
      '<div class="hbar-t"><div class="hbar-f'+(isLast?" now":"")+'" style="height:'+h+'%"></div></div>'+
      '<div class="hbar-l">'+Number(k.slice(5,7))+'月</div>'+
    '</div>';
  });
  cw.innerHTML = '<div class="hbars">'+bars+'</div>';

  /* 履歴リスト */
  const list = document.getElementById("hist-list");
  all.slice().reverse().forEach(s=>{
    const st = sessionStats(s); if(!st) return;
    const row = document.createElement("div");
    row.className = "hrow";
    const sets = (s.sets||[]).filter(x=>x&&x.w!=null&&x.r!=null)
      .map(x=> '<span class="pset"><b>'+fmtNum(x.w)+'</b>×'+x.r+'</span>').join("");
    row.innerHTML =
      '<div class="hrow-h"><span class="hrow-d">'+fmtDateFull(s.date)+'</span>'+
        '<span class="hrow-m">最大 '+st.maxW+'kg</span></div>'+
      '<div class="sets">'+sets+'</div>'+
      (s.memo && s.memo.trim() ? '<div class="hrow-memo">'+escapeHtml(s.memo)+'</div>' : '');
    list.appendChild(row);
  });

  sheet.querySelectorAll("#hist-mode .wmode-btn").forEach(b=>{
    b.onclick = ()=>{ state.ui.histMode = b.dataset.m; save(); renderHistory(exId); };
  });
  document.getElementById("h-close").onclick = hideSheet;
}

/* ============================================================
   数値ピッカー（縦スクロールで選ぶ）
   ±の連打がしんどいという声を受けて追加。よく使う値ほど上に出す。
   ============================================================ */
/* ============================================================
   重量の入力（打ち込みが主役／微調整はスライダー）
   ============================================================ */
/* 一覧を、指定した値がちょうど中央に来る位置までスクロールする */
const LIST_ITEM_H = 54;
function centerListOn(wrap, list, target){
  if(wrap==null || target==null || isNaN(target)) return;
  let idx = 0, bd = Infinity;
  list.forEach((v,i)=>{ const d = Math.abs(v-target); if(d<bd){ bd = d; idx = i; } });
  const h = wrap.clientHeight || 260;
  /* 上下に余白を入れておくと、一覧の端の値でもきちんと中央に来る */
  const pad = Math.max(0, (h - LIST_ITEM_H)/2);
  wrap.style.paddingTop = pad+"px";
  wrap.style.paddingBottom = pad+"px";
  wrap.scrollTop = idx*LIST_ITEM_H;
}

function openKgInput({title, unit, decimal, step, current, suggest, onPick}){
  const has = (v)=> v!=null && !isNaN(v);
  const near = has(current) ? current : (has(suggest) ? suggest : null);

  const sheet = document.getElementById("sheet");
  sheet.innerHTML =
    '<h2>'+title+'</h2>'+
    '<div class="kg-in-row">'+
      '<input class="kg-in num" id="kg-in" type="number" inputmode="decimal" step="0.5" '+
        'placeholder="'+(near!=null?near:"0")+'" value="'+(has(current)?current:"")+'">'+
      '<span class="kg-in-u">kg</span>'+
    '</div>'+
    '<div class="wheel-list" id="kg-list"></div>'+
    '<div class="sheet-btns">'+
      '<button class="btn ghost" id="kg-close">閉じる</button>'+
      '<button class="btn primary" id="kg-ok">決定</button>'+
    '</div>';
  showSheet();

  const inp = document.getElementById("kg-in");

  /* 下の一覧：2.5kg刻み */
  /* 重量の候補：プレートの2.5kg刻みと、ダンベルの2kg刻み(12,14,16…)の両方を出す */
  const list = [];
  const push = v=>{ v=Math.round(v*100)/100; if(list.indexOf(v)<0) list.push(v); };
  [1,1.25,1.5,2,3,4,5,6,7,8,9,10].forEach(push);      // 軽量帯は細かく
  for(let v=2.5; v<=300; v+=2.5) push(v);              // プレート
  for(let v=2;   v<=60;  v+=2)   push(v);              // ダンベル
  list.sort((a,b)=> a-b);
  const wrap = document.getElementById("kg-list");
  let selEl = null;
  list.forEach(v=>{
    const b = document.createElement("button");
    const isNow = has(current) && Math.abs(current-v)<0.001;
    b.className = "wheel-item" + (isNow?" active":"");
    b.innerHTML = '<span class="wv num">'+v+'</span><span class="wu">kg</span>';
    b.onclick = ()=>{ onPick(v); hideSheet(); };
    if(isNow) selEl = b;
    wrap.appendChild(b);
  });

  document.getElementById("kg-ok").onclick = ()=>{
    const v = parseFloat(inp.value);
    if(isNaN(v) || v<0){ inp.focus(); return; }
    onPick(Math.round(v*10)/10);
    hideSheet();
  };
  document.getElementById("kg-close").onclick = hideSheet;

  /* タップするたびに全選択して、そのまま打ち直せるようにする */
  const selectAll = ()=>{ try{ inp.select(); inp.setSelectionRange(0, inp.value.length); }catch(e){} };
  inp.addEventListener("focus", selectAll);
  inp.addEventListener("click", selectAll);
  setTimeout(()=>{ inp.focus(); selectAll(); }, 120);

  /* 一覧は今の値（なければ前回値）の位置まで寄せておく */
  const focusV = has(current) ? current : near;
  centerListOn(wrap, list, focusV);
  setTimeout(()=> centerListOn(wrap, list, focusV), 40);   // シートの表示アニメ後にもう一度合わせる
}

function openNumberWheel({title, unit, decimal, step, current, suggest, onPick, forceList}){
  const sheet = document.getElementById("sheet");
  const isKg = unit === "kg";
  const has = (v)=> v!=null && !isNaN(v);

  /* 重量は「打ち込み」を主役にする（一覧は下の導線から） */
  if(isKg && !forceList){
    openKgInput({title, unit, decimal, step, current, suggest, onPick});
    return;
  }

  /* 候補の作り方：
     重量 → 2.5kg刻みを軸に、前回値や現在値の周辺を厚めに
     回数 → 1〜30を全部 */
  let list = [];
  if(isKg){
    const push = v=>{ v=Math.round(v*100)/100; if(list.indexOf(v)<0) list.push(v); };
    [1,1.25,1.5,2,3,4,5,6,7,8,9,10].forEach(push);
    for(let v=2.5; v<=300; v+=2.5) push(v);
    for(let v=2;   v<=60;  v+=2)   push(v);
    list.sort((a,b)=>a-b);
  }else if(unit === "回"){
    for(let v=1; v<=30; v++) list.push(v);
  }else{
    const base = has(current)? current : (has(suggest)? suggest : 0);
    for(let i=0;i<40;i++){
      const v = Math.max(0, Math.round((base - 20*step + i*step)*10)/10);
      if(list.indexOf(v)<0) list.push(v);
    }
  }

  const near = has(current) ? current : (has(suggest) ? suggest : null);
  sheet.innerHTML =
    '<h2>'+title+'</h2>'+
    (near!=null ? '<div class="wheel-quick" id="wheel-quick"></div>' : '')+
    '<div class="wheel-list" id="wheel-list"></div>'+
    '<div class="sheet-btns">'+
      '<button class="btn ghost" id="wheel-close">閉じる</button>'+
      '<button class="btn ghost" id="wheel-manual">'+(isKg?"数字で入力":"自分で入力")+'</button>'+
    '</div>';
  showSheet();

  /* 上部に「前回値の周辺」をショートカットで並べる */
  if(near!=null){
    const q = document.getElementById("wheel-quick");
    const offs = isKg ? [-5,-2.5,0,2.5,5] : [-2,-1,0,1,2];
    offs.forEach(o=>{
      const v = Math.round((near+o)*10)/10;
      if(v<=0) return;
      const b = document.createElement("button");
      b.className = "wheel-q" + (o===0?" now":"");
      b.textContent = (decimal? v : Math.round(v));
      b.onclick = ()=>{ onPick(decimal? v : Math.round(v)); hideSheet(); };
      q.appendChild(b);
    });
  }

  const wrap = document.getElementById("wheel-list");
  let selEl = null;
  list.forEach(v=>{
    const b = document.createElement("button");
    const isNow = (has(current) && Math.abs(current-v)<0.001);
    b.className = "wheel-item" + (isNow?" active":"");
    b.innerHTML = '<span class="wv num">'+(decimal? v : Math.round(v))+'</span><span class="wu">'+unit+'</span>';
    b.onclick = ()=>{ onPick(decimal? v : Math.round(v)); hideSheet(); };
    if(isNow) selEl = b;
    wrap.appendChild(b);
  });
  document.getElementById("wheel-close").onclick = hideSheet;
  document.getElementById("wheel-manual").onclick = ()=>{
    sheet.innerHTML =
      '<h2>'+title+'</h2>'+
      '<input class="text num" id="wheel-in" type="number" inputmode="'+(decimal?"decimal":"numeric")+'" '+
        'step="'+step+'" placeholder="'+(near!=null?near:"")+'" value="'+(has(current)?current:"")+'">'+
      '<div class="sheet-btns">'+
        '<button class="btn ghost" id="wi-back">戻る</button>'+
        '<button class="btn primary" id="wi-ok">決定</button>'+
      '</div>';
    const inp = document.getElementById("wheel-in");
    setTimeout(()=>{ inp.focus(); inp.select&&inp.select(); }, 80);
    document.getElementById("wi-back").onclick = ()=> openNumberWheel({title,unit,decimal,step,current,suggest,onPick});
    document.getElementById("wi-ok").onclick = ()=>{
      const v = parseFloat(inp.value);
      if(isNaN(v) || v<0){ inp.focus(); return; }
      onPick(decimal? Math.round(v*10)/10 : Math.round(v));
      hideSheet();
    };
  };
  /* 今の値までスクロールしておく */
  centerListOn(wrap, list, near);
  setTimeout(()=> centerListOn(wrap, list, near), 40);
}

/* セット値が変わったら保存し、更新バッジだけ即時反映するため行を再構築 */
let commitTimer=null;
function commitSet(exId, idx, set){
  const cs = todaySession(exId); if(cs) cs.t = Date.now();   // 「最近」の並び順用
  save();
  clearTimeout(commitTimer);
  commitTimer = setTimeout(()=>{
    // 更新バッジの付け外しのために本文だけ再描画（入力中の連打を避けるため軽くdebounce）
    const active = document.activeElement;
    if(active && active.tagName === "INPUT") return; // 入力中は再描画しない
    renderTrainBody();
  }, 50);
}

/* ============================================================
   種目の追加・編集・削除シート
   ============================================================ */
function openExerciseSheet(ex, prefill){
  const isEdit = !!ex;
  const areaFallback = (state.ui.currentArea && state.ui.currentArea!=="recent") ? state.ui.currentArea : AREAS[0].id;
  let selCat = isEdit ? ex.cat : areaFallback;
  let selStores = isEdit
      ? (Array.isArray(ex.stores)&&ex.stores.length ? ex.stores.slice() : state.stores.map(s=>s.id))
      : [curStore()];
  const sheet = document.getElementById("sheet");
  const areaPills = AREAS.map(a=>
    '<button class="area-pill" data-cat="'+a.id+'">'+a.name+'</button>').join("");
  const storePills = state.stores.map(s=>
    '<button class="area-pill st" data-st="'+s.id+'">'+escapeHtml(s.name)+'</button>').join("");
  sheet.innerHTML =
    '<h2>'+(isEdit?"種目を編集":"種目を追加")+'</h2>'+
    '<input class="text" id="ex-name" placeholder="種目名（例：ダンベルカール）" value="'+escapeHtml(isEdit?ex.name:(prefill||""))+'">'+
    '<div class="pill-label">エリア</div>'+
    '<div class="area-pills" id="area-pills">'+areaPills+'</div>'+
    '<div class="pill-label">この種目がある店舗（複数可）</div>'+
    '<div class="area-pills" id="store-pills">'+storePills+'</div>'+
    '<div class="sheet-btns">'+
      '<button class="btn ghost" id="ex-cancel">キャンセル</button>'+
      '<button class="btn primary" id="ex-ok">'+(isEdit?"保存":"追加")+'</button>'+
    '</div>'+
    (isEdit?'<a class="del-link" id="ex-del">この種目を削除</a>':'');
  showSheet();
  const nameInput = document.getElementById("ex-name");
  setTimeout(()=> nameInput.focus(), 100);

  function paintPills(){
    sheet.querySelectorAll("#area-pills .area-pill").forEach(p=>
      p.classList.toggle("active", p.dataset.cat===selCat));
    sheet.querySelectorAll("#store-pills .area-pill").forEach(p=>
      p.classList.toggle("active", selStores.indexOf(p.dataset.st)>=0));
  }
  paintPills();
  sheet.querySelectorAll("#area-pills .area-pill").forEach(p=>{
    p.onclick = ()=>{ selCat = p.dataset.cat; paintPills(); };
  });
  sheet.querySelectorAll("#store-pills .area-pill").forEach(p=>{
    p.onclick = ()=>{
      const id = p.dataset.st, i = selStores.indexOf(id);
      if(i>=0){ if(selStores.length>1) selStores.splice(i,1); }   // 最低1店舗は必要
      else selStores.push(id);
      paintPills();
    };
  });

  document.getElementById("ex-cancel").onclick = hideSheet;
  document.getElementById("ex-ok").onclick = ()=>{
    const name = nameInput.value.trim();
    if(!name){ nameInput.focus(); return; }
    if(isEdit){ ex.name = name; ex.cat = selCat; ex.stores = selStores.slice(); }
    else{
      const nid = uid();
      state.exercises.push({id:nid, name, cat:selCat, stores:selStores.slice()});
      state.ui.currentExId = nid;
    }
    if(selStores.indexOf(curStore())<0) state.ui.storeId = selStores[0];
    state.ui.currentArea = selCat;
    state.ui.q = "";
    const si2 = document.getElementById("ex-search"); if(si2) si2.value = "";
    save(); hideSheet(); renderTrain();
  };
  if(isEdit){
    document.getElementById("ex-del").onclick = ()=>{
      if(confirm('「'+ex.name+'」と、その記録をすべて削除しますか？')){
        const cat = ex.cat;
        state.exercises = state.exercises.filter(e=> e.id!==ex.id);
        delete state.sessions[ex.id];
        if(state.ui.currentExId===ex.id){
          const pool = state.exercises.filter(e=> inStore(e));
          const sameArea = pool.find(e=> e.cat===cat);
          state.ui.currentExId = sameArea ? sameArea.id : (pool[0]?pool[0].id:null);
        }
        save(); hideSheet(); renderTrain();
      }
    };
  }
}
function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function showSheet(){ document.getElementById("backdrop").classList.add("show"); localize(document.getElementById("sheet")); }
function hideSheet(){ document.getElementById("backdrop").classList.remove("show"); if(typeof stopScanner==="function") stopScanner(); }
document.getElementById("backdrop").onclick = (e)=>{ if(e.target.id==="backdrop") hideSheet(); };

/* ============================================================
   インターバルタイマー
   ============================================================ */
/* ============================================================
   インターバルタイマー
   ・残り時間は「終了時刻」から毎回計算する（画面を閉じてもズレない）
   ・終了の合図は音声ファイルとして先に再生しておく
     → iPhoneは裏に回るとJavaScriptが止まるが、音の再生は続くため
        別のアプリを見ていても・画面を消していても鳴る
   ============================================================ */
let timer = { total:0, endAt:0, id:null, running:false };
let alarmEl = null, alarmUrl = null, wakeLock = null;

/* 音声セッション：標準は transient-solo（終了音の間だけ音楽を止めて、終わったら音楽を再開）。
   transient だと、イヤホン接続中に終了音が出ないことがあるため。非対応の端末では無視される */
function setAlarmSession(){
  try{
    if(!("audioSession" in navigator)) return;
    navigator.audioSession.type = alarmSolo() ? "playback" : "transient-solo";
    if(navigator.audioSession.type === "auto") navigator.audioSession.type = "playback";
  }catch(e){ try{ navigator.audioSession.type = "playback"; }catch(_){} }
}
function vibrate(){ if(navigator.vibrate) navigator.vibrate([200,80,200,80,300]); }

/* 「無音 → 終了音」という音声データをその場で作る */
function makeAlarmWav(sec){
  const SR = 6000;                       // 音が分かればよいので低めにして容量を抑える
  const silent = Math.max(0, Math.round(sec*SR));
  const beep   = Math.round(6.0*SR);
  const n = silent + beep;
  const buf = new Uint8Array(44 + n);
  const dv = new DataView(buf.buffer);
  const wr = (o,str)=>{ for(let k=0;k<str.length;k++) buf[o+k]=str.charCodeAt(k); };
  wr(0,"RIFF"); dv.setUint32(4, 36+n, true); wr(8,"WAVEfmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,SR,true); dv.setUint32(28,SR,true);
  dv.setUint16(32,1,true); dv.setUint16(34,8,true);
  wr(36,"data"); dv.setUint32(40, n, true);
  buf.fill(128, 44);                     // 8bitの無音は128
  /* 終了音：0.15秒鳴らして0.25秒空ける、を繰り返す */
  for(let k=0;k<beep;k++){
    const t = k/SR, ph = t % 0.40;
    if(ph < 0.15){
      const env = Math.min(1, ph/0.01, (0.15-ph)/0.02);
      buf[44+silent+k] = 128 + Math.round(126*env*Math.sin(2*Math.PI*880*t));
    }
  }
  return new Blob([buf], {type:"audio/wav"});
}

function ensureAlarmEl(){
  if(alarmEl) return alarmEl;
  alarmEl = document.createElement("audio");
  alarmEl.setAttribute("playsinline","");
  alarmEl.preload = "auto";
  /* イヤホンの抜き差し・Bluetooth切替・通話などで再生が止まされることがある。
     タイマー中なら、経過した位置まで進めて再生し直す */
  const resume = ()=>{ if(timer.running) resumeAlarm(); };
  alarmEl.addEventListener("pause", resume);
  alarmEl.addEventListener("stalled", resume);
  alarmEl.addEventListener("ended", ()=>{ if(!timer.running) releaseAlarmMedia(); });
  document.body.appendChild(alarmEl);
  return alarmEl;
}

/* 再生が止まっていたら、経過時間の位置から再開する */
function resumeAlarm(){
  try{
    const el = alarmEl;
    if(!el || !timer.running || !el.src) return;
    const elapsed = Math.max(0, timer.total - remainSec());
    if(Math.abs(el.currentTime - elapsed) > 1.5){ try{ el.currentTime = elapsed; }catch(e){} }
    if(el.paused){
      setAlarmSession();
      const pr = el.play();
      if(pr && pr.catch) pr.catch(()=>{});
    }
  }catch(e){}
}

/* 音声データ・メディアセッションを手放す（残しておくと重くなる原因になる） */
function releaseAlarmMedia(){
  try{
    if(alarmEl){ alarmEl.pause(); alarmEl.removeAttribute("src"); alarmEl.load(); }
    if(alarmUrl){ URL.revokeObjectURL(alarmUrl); alarmUrl = null; }
    if("mediaSession" in navigator){
      navigator.mediaSession.metadata = null;
      try{ navigator.mediaSession.setActionHandler("pause", null); }catch(e){}
      try{ navigator.mediaSession.setActionHandler("stop", null); }catch(e){}
    }
  }catch(e){}
}

/* 保険：Web Audioで直接ピッピッと鳴らす（画面が表示中に、上の音声が鳴らなかった場合用） */
let fbCtx = null;
function fallbackBeep(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!fbCtx) fbCtx = new AC();
    if(fbCtx.state === "suspended") fbCtx.resume();
    const t0 = fbCtx.currentTime + 0.05;
    for(let i=0;i<5;i++){
      const o = fbCtx.createOscillator(), g = fbCtx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      const a = t0 + i*0.4;
      g.gain.setValueAtTime(0.0001, a);
      g.gain.exponentialRampToValueAtTime(0.8, a+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, a+0.15);
      o.connect(g); g.connect(fbCtx.destination);
      o.start(a); o.stop(a+0.18);
    }
  }catch(e){}
}

function startTimer(sec){
  stopAlarm();
  timer.total = sec;
  timer.endAt = Date.now() + sec*1000;
  timer.running = true;
  hideTimerDone();

  /* 音声を仕込む（タップ直後なので再生が許可される） */
  try{
    /* transient = 通知音の扱い。他アプリの音楽を止めず、鳴っている間だけ音量を下げる。
       solo にすると確実に前に出るが、音楽が停止する。                     */
    setAlarmSession();
    const el = ensureAlarmEl();
    if(alarmUrl){ URL.revokeObjectURL(alarmUrl); alarmUrl = null; }
    /* タップ中に保険用のWeb Audioも解錠しておく */
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC){ if(!fbCtx) fbCtx = new AC(); if(fbCtx.state==="suspended") fbCtx.resume(); }
    }catch(e){}
    alarmUrl = URL.createObjectURL(makeAlarmWav(sec));
    el.src = alarmUrl;
    el.currentTime = 0;
    const pr = el.play();
    if(pr && pr.catch) pr.catch(()=>{});
    if("mediaSession" in navigator){
      const m = Math.floor(sec/60), r = sec%60;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "インターバル "+(m? m+":"+String(r).padStart(2,"0") : r+"秒"),
        artist: "トレーニングノート"
      });
      try{ navigator.mediaSession.setActionHandler("pause", ()=> resetTimer()); }catch(e){}
      try{ navigator.mediaSession.setActionHandler("stop",  ()=> resetTimer()); }catch(e){}
    }
  }catch(e){}

  requestWake();
  clearInterval(timer.id);
  timer.id = setInterval(tickTimer, 250);
  tickTimer();
}

function tickTimer(){
  if(!timer.running) return;
  const left = Math.ceil((timer.endAt - Date.now())/1000);
  if(left <= 0){
    timer.running = false;
    clearInterval(timer.id);
    updateTimerUI(true);
    vibrate();
    showTimerDone();
    releaseWake();
    if(document.visibilityState === "visible") fallbackBeep();
    /* 音声が止まっていた・まだ無音の位置なら、鳴らし直す */
    try{
      if(alarmEl && alarmEl.src){
        if(alarmEl.paused || alarmEl.currentTime < timer.total - 0.7){
          try{ alarmEl.currentTime = timer.total; }catch(e){}
          const pr = alarmEl.play(); if(pr && pr.catch) pr.catch(fallbackBeep);
        }
      }else fallbackBeep();
    }catch(e){ fallbackBeep(); }
  }else{
    updateTimerUI();
  }
}

function remainSec(){ return Math.max(0, Math.ceil((timer.endAt - Date.now())/1000)); }

function stopAlarm(){
  releaseAlarmMedia();
}
function resetTimer(){
  clearInterval(timer.id);
  timer.running=false; timer.endAt=0; timer.total=0;
  stopAlarm(); releaseWake(); hideTimerDone();
  updateTimerUI();
}

/* 休憩中に画面が消えないようにする（対応している端末のみ） */
async function requestWake(){
  try{
    if("wakeLock" in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
    }
  }catch(e){}
}
function releaseWake(){ try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){} }

function updateTimerUI(finished){
  const t = document.getElementById("t-time");
  const lbl = document.getElementById("t-label");
  const prog = document.getElementById("t-progress");
  if(timer.running){
    const left = remainSec();
    const m = Math.floor(left/60), s = left%60;
    t.textContent = m+":"+String(s).padStart(2,"0");
    t.classList.remove("idle","done");
    t.classList.toggle("soon", left<=10);
    lbl.textContent = "残り";
    prog.style.width = (timer.total? (left/timer.total*100):0)+"%";
  }else if(finished){
    t.textContent = "完了"; t.classList.remove("idle","soon"); t.classList.add("done");
    lbl.textContent = "インターバル";
    prog.style.width = "0%";
  }else{
    t.textContent = "休憩"; t.classList.add("idle"); t.classList.remove("soon","done");
    lbl.textContent = "インターバル";
    prog.style.width = "0%";
  }
}

/* 終了の表示（上部に大きく出して、もう一度／閉じる を選べる） */
function showTimerDone(){
  const el = document.getElementById("t-done");
  const sec = timer.total || 0;
  const m = Math.floor(sec/60), r = sec%60;
  document.getElementById("td-sub").textContent =
    (m? m+"分"+(r? r+"秒":"") : r+"秒") + " のインターバルが終わりました";
  el.classList.add("show");
}
function hideTimerDone(){
  const el = document.getElementById("t-done");
  if(el) el.classList.remove("show");
}

document.querySelectorAll(".t-preset[data-sec]").forEach(b=>{
  b.onclick = ()=> startTimer(parseInt(b.dataset.sec,10));
});
document.getElementById("t-stop").onclick = resetTimer;

document.getElementById("td-again").onclick = ()=>{
  const sec = timer.total || (state.ui && state.ui.customSec) || 60;
  startTimer(sec);
};
document.getElementById("td-close").onclick = ()=>{ hideTimerDone(); resetTimer(); };

/* 裏から戻ってきたときに表示を合わせ直す（裏では時計が止まるため） */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState !== "visible") return;
  if(timer.running){
    if(remainSec() <= 0){
      timer.running = false; clearInterval(timer.id);
      updateTimerUI(true); showTimerDone(); releaseWake();
    }else{
      updateTimerUI(); requestWake(); resumeAlarm();
    }
  }
});
document.getElementById("t-custom-btn").onclick = openTimerDialer;
document.getElementById("t-display").onclick = openTimerDialer; // 時間表示タップでも開く

/* ---------- カスタムタイマー（自由設定） ---------- */
function openTimerDialer(){
  /* 30秒刻みの縦スクロールから選ぶ方式（±の連打をやめた） */
  const cur = (state.ui && state.ui.customSec) ? state.ui.customSec : 120;
  const sheet = document.getElementById("sheet");
  sheet.innerHTML =
    '<h2>インターバルを選ぶ</h2>'+
    '<div class="wheel-list" id="tw-list"></div>'+
    '<p class="set-note">選ぶとすぐに開始します。次からは同じ時間が「⋯」に入ります。</p>'+
    '<div class="sheet-btns"><button class="btn ghost" id="tw-close">閉じる</button></div>';
  showSheet();

  const wrap = document.getElementById("tw-list");
  const secs = [];
  for(let x=30; x<=600; x+=30) secs.push(x);
  for(let sec=30; sec<=600; sec+=30){
    const m = Math.floor(sec/60), r = sec%60;
    const label = m ? (m+"分"+(r?" "+r+"秒":"")) : (r+"秒");
    const b = document.createElement("button");
    const isNow = sec===cur;
    b.className = "wheel-item" + (isNow?" active":"");
    b.innerHTML = '<span class="wv num">'+(m? m+":"+String(r).padStart(2,"0") : "0:30")+'</span>'+
                  '<span class="wu">'+label+'</span>';
    b.onclick = ()=>{
      state.ui.customSec = sec; save();
      hideSheet(); startTimer(sec);
    };
    wrap.appendChild(b);
  }
  document.getElementById("tw-close").onclick = hideSheet;
  centerListOn(wrap, secs, cur);
  setTimeout(()=> centerListOn(wrap, secs, cur), 40);
}

function renderWeight(){
  document.getElementById("weight-date").textContent = fmtDateFull(todayStr());
  const lbl = document.getElementById("w-entry-label");
  lbl.textContent = (weightDate===todayStr() ? "今朝の体重" : fmtDateFull(weightDate)+" の体重");
  const rec = state.weights.find(w=> w.date===weightDate);
  const input = document.getElementById("w-input");
  const saveBtn = document.getElementById("w-save");
  input.value = rec ? rec.kg : "";
  saveBtn.textContent = rec ? "更新" : "記録";
  renderGoalRow();
  document.querySelectorAll('.wmode-btn').forEach(b=> b.classList.toggle('active', b.dataset.mode===(state.ui.wMode||'week')));

  renderWeightList();

}

document.querySelectorAll('#view-weight .stepper').forEach(b=>{
  b.onclick = ()=>{
    const input = document.getElementById("w-input");
    const step = parseFloat(b.dataset.w);
    let v = parseFloat(input.value); if(isNaN(v)) v = 60;
    v = Math.round((v+step)*10)/10; if(v<0) v=0;
    input.value = v;
  };
});
document.getElementById("w-save").onclick = ()=>{
  const input = document.getElementById("w-input");
  const kg = parseFloat(input.value);
  if(isNaN(kg) || kg<=0){ input.focus(); return; }
  const existing = state.weights.find(w=> w.date===weightDate);
  if(existing) existing.kg = Math.round(kg*10)/10;
  else state.weights.push({date:weightDate, kg:Math.round(kg*10)/10});
  save();
  const btn = document.getElementById("w-save");
  btn.classList.add("done"); btn.textContent="保存済";
  toast("体重を記録しました");
  setTimeout(()=>{ btn.classList.remove("done"); renderWeight(); }, 900);
};

function renderGoalRow(){
  const el = document.getElementById("goal-row");
  const g = state.weightGoal;
  if(g==null){
    el.innerHTML = '<button class="goal-set" id="goal-set">＋ 目標体重を設定</button>';
    document.getElementById("goal-set").onclick = openGoalSheet;
    return;
  }
  const data = state.weights.slice().sort((a,b)=> a.date<b.date?-1:1);
  const latest = data.length ? data[data.length-1].kg : null;
  let remainTxt = "";
  if(latest!=null){
    const r = Math.round((latest-g)*10)/10;
    remainTxt = Math.abs(r)<0.05 ? "達成！" : ("あと "+Math.abs(r)+"kg "+(r>0?"減":"増"));
  }
  el.innerHTML =
    '<div class="goal-info"><span class="goal-k">目標</span><span class="goal-v num">'+g+' kg</span>'+
    (remainTxt? '<span class="goal-remain'+(remainTxt==="達成！"?" hit":"")+'">'+remainTxt+'</span>':'')+'</div>'+
    '<button class="goal-edit" id="goal-edit">✎</button>';
  document.getElementById("goal-edit").onclick = openGoalSheet;
}
function openGoalSheet(){
  const sheet = document.getElementById("sheet");
  const cur = state.weightGoal!=null ? state.weightGoal : "";
  sheet.innerHTML =
    '<h2>目標体重</h2>'+
    '<input class="text num" id="goal-input" type="number" inputmode="decimal" step="0.1" placeholder="例: 70.0" value="'+cur+'">'+
    '<div class="sheet-btns">'+
      '<button class="btn ghost" id="goal-cancel">閉じる</button>'+
      '<button class="btn primary" id="goal-ok">保存</button>'+
    '</div>'+
    (state.weightGoal!=null ? '<a class="del-link" id="goal-del">目標を削除</a>' : '');
  showSheet();
  setTimeout(()=> document.getElementById("goal-input").focus(), 100);
  document.getElementById("goal-cancel").onclick = hideSheet;
  document.getElementById("goal-ok").onclick = ()=>{
    const v = parseFloat(document.getElementById("goal-input").value);
    if(isNaN(v) || v<=0){ document.getElementById("goal-input").focus(); return; }
    state.weightGoal = Math.round(v*10)/10; save(); hideSheet(); renderWeight();
  };
  if(state.weightGoal!=null){
    document.getElementById("goal-del").onclick = ()=>{
      state.weightGoal = null; save(); hideSheet(); renderWeight();
    };
  }
}

/* 期間集計（日=直近21件 / 週=週平均 / 月=月平均、いずれも直近まで） */
function weekKey(ds){
  const p=ds.split("-").map(Number); const d=new Date(p[0],p[1]-1,p[2]);
  const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function aggregateWeights(mode){
  const data = state.weights.slice().sort((a,b)=> a.date<b.date?-1:1);
  if(mode==="day") return data.slice(-21).map(d=>({kg:d.kg}));
  const keyFn = mode==="week" ? weekKey : (ds=> ds.slice(0,7));
  const groups = {};
  data.forEach(d=>{ const k=keyFn(d.date); (groups[k]=groups[k]||[]).push(d.kg); });
  return Object.keys(groups).sort().map(k=>{
    const arr=groups[k]; return {kg: Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*10)/10};
  }).slice(-12);
}

function renderWeightChart(){
  const wrap = document.getElementById("w-chart");
  const stats = document.getElementById("w-stats");
  const daily = state.weights.slice().sort((a,b)=> a.date<b.date?-1:1);
  const mode = state.ui.wMode || "week";
  const series = aggregateWeights(mode);

  if(series.length < 2){
    stats.innerHTML = "";
    const need = mode==="day" ? "2日" : (mode==="week" ? "2週" : "2か月");
    wrap.innerHTML = '<div class="chart-empty">'+need+'分そろうとグラフが表示されます</div>';
    // 統計だけは1件でも出す
    if(daily.length){
      const latest = daily[daily.length-1].kg;
      stats.innerHTML = '<div class="stat"><div class="k">現在</div><div class="v num">'+latest+'<span style="font-size:13px;color:var(--muted)"> kg</span></div></div>';
    }
    return;
  }

  const kgs = series.map(d=>d.kg);
  let min = Math.min(...kgs), max = Math.max(...kgs);
  const goal = state.weightGoal;
  if(goal!=null){ min=Math.min(min,goal); max=Math.max(max,goal); }
  const pad = Math.max((max-min)*0.15, 0.5);
  min -= pad; max += pad;

  const W = Math.max(wrap.clientWidth || 340, 240);
  const H = 180, PX = 8, PY = 14;
  const n = series.length;
  const x = i=> PX + (i/(n-1))*(W-2*PX);
  const y = v=> PY + (H-2*PY) - ((v-min)/(max-min))*(H-2*PY);

  let line="", area="M"+x(0).toFixed(1)+","+H;
  series.forEach((d,i)=>{
    const px=x(i), py=y(d.kg);
    line += (i===0?"M":"L")+px.toFixed(1)+","+py.toFixed(1)+" ";
    area += " L"+px.toFixed(1)+","+py.toFixed(1);
  });
  area += " L"+x(n-1).toFixed(1)+","+H+" Z";
  let dots="";
  series.forEach((d,i)=>{
    const last = i===n-1;
    dots += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(d.kg).toFixed(1)+'" r="'+(last?4:2.5)+'" fill="#9D4EE8"'+(last?' stroke="#0D0A12" stroke-width="2"':'')+'/>';
  });

  // 目標ライン
  let goalLine="";
  if(goal!=null){
    const gy = y(goal).toFixed(1);
    goalLine =
      '<line x1="'+PX+'" y1="'+gy+'" x2="'+(W-PX)+'" y2="'+gy+'" stroke="#35D07F" stroke-width="1.5" stroke-dasharray="5 4"/>'+
      '<text x="'+(W-PX)+'" y="'+(y(goal)-5).toFixed(1)+'" text-anchor="end" fill="#35D07F" font-size="11" font-weight="700">目標 '+goal+'</text>';
  }

  wrap.innerHTML =
    '<svg class="chart" viewBox="0 0 '+W+' '+H+'" style="height:'+H+'px">'+
      '<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" stop-color="rgba(157,78,232,.45)"/>'+
        '<stop offset="100%" stop-color="rgba(157,78,232,0)"/>'+
      '</linearGradient></defs>'+
      '<path d="'+area+'" fill="url(#wg)"/>'+
      goalLine+
      '<path d="'+line+'" fill="none" stroke="#9D4EE8" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
      dots+
    '</svg>';

  // 統計（日次データから算出）
  const latest = daily[daily.length-1].kg;
  const first = daily[0].kg;
  const diff = Math.round((latest-first)*10)/10;
  const diffCls = diff<0 ? "up" : (diff>0 ? "down":"");
  const diffTxt = (diff>0?"+":"")+diff+"kg";
  let second;
  if(goal!=null){
    const r = Math.round((latest-goal)*10)/10;
    const rTxt = Math.abs(r)<0.05 ? "達成" : ((r>0?"−":"+")+Math.abs(r)+"kg");
    second = '<div class="stat"><div class="k">目標まで</div><div class="v num '+(Math.abs(r)<0.05?"up":"")+'">'+rTxt+'</div></div>';
  }else{
    second = '<div class="stat"><div class="k">記録開始から</div><div class="v num '+diffCls+'">'+diffTxt+'</div></div>';
  }
  stats.innerHTML =
    '<div class="stat"><div class="k">現在</div><div class="v num">'+latest+'<span style="font-size:13px;color:var(--muted)"> kg</span></div></div>'+
    second;
}

function renderWeightList(){
  const list = document.getElementById("w-list");
  const data = state.weights.slice().sort((a,b)=> a.date<b.date?1:-1); // 新しい順
  if(!data.length){ list.innerHTML = '<div class="chart-empty">まだ記録がありません</div>'; return; }
  list.innerHTML = "";
  data.forEach((d,i)=>{
    const prev = data[i+1]; // 1つ前(=より古い日)
    let diffHtml="";
    if(prev){
      const df = Math.round((d.kg-prev.kg)*10)/10;
      if(df!==0){ diffHtml = '<span class="diff '+(df<0?"up":"down")+'">'+(df>0?"+":"")+df+'</span>'; }
    }
    const row = document.createElement("div");
    row.className = "w-row";
    row.innerHTML =

/* ============================================================
   メニュー（あらかじめ用意したデータを表示する。通信なし・費用なし）

/* ============================================================
   マイメニュー（自分の記録から自動でできるメニュー表）
   ・部位ごとに「いつもやっている種目」を、やる順番と平均セット数つきで出す
   ・まだやっていない種目も並べて、新しい挑戦のきっかけにする
   ============================================================ */
function myMenu(pid){
  /* その部位がメインの種目を、実際にやった日ごとに集計する */
  const pool = storeExercises();
  const {main, sub} = exercisesByPart(pid, pool);
  const targets = main.concat(sub);

  const stat = {};
  targets.forEach(ex=>{
    const ss = (state.sessions[ex.id]||[]).filter(hasData);
    if(!ss.length){ stat[ex.id] = null; return; }
    let sets=0, wsum=0, wn=0, best=0, last="";
    ss.forEach(x=>{
      const v = (x.sets||[]).filter(y=> y && y.w!=null && y.r!=null);
      sets += v.length;
      v.forEach(y=>{ wsum += y.w; wn++; if(y.w>best) best=y.w; });
      if(x.date > last) last = x.date;
    });
    stat[ex.id] = {days:ss.length, sets:sets, avgSets: ss.length? Math.round(sets/ss.length*10)/10 : 0,
                   best:best, last:last, order:orderOf(ex.id)};
  });

  const done = targets.filter(e=> stat[e.id]).sort((a,b)=>{
    const A=stat[a.id], B=stat[b.id];
    if(A.order !== B.order) return A.order - B.order;   // いつもやる順
    return B.days - A.days;
  });
  const todo = targets.filter(e=> !stat[e.id]);
  return {done, todo, stat};
}

/* その種目が、その日の何番目に行われることが多いか（平均の順番） */
function orderOf(exId){
  const pos = [];
  const dates = {};
  Object.keys(state.sessions).forEach(id=>{
    (state.sessions[id]||[]).forEach(s=>{
      if(!hasData(s)) return;
      (dates[s.date] = dates[s.date] || []).push({id:id, t:s.t||0});
    });
  });
  Object.keys(dates).forEach(d=>{
    const arr = dates[d].sort((a,b)=> a.t-b.t);
    const i = arr.findIndex(x=> x.id===exId);
    if(i>=0) pos.push(i+1);
  });
  if(!pos.length) return 99;
  return pos.reduce((a,b)=>a+b,0)/pos.length;
}

/* メニューの種目名を、この店舗にある種目に結びつける */
function resolveEx(item){
  const cand = [item.name].concat(item.alt || []);
  for(let i=0;i<cand.length;i++){
    const nq = norm(cand[i]);
    const hit = state.exercises.find(e=> inStore(e) && norm(e.name)===nq)
             || state.exercises.find(e=> inStore(e) && norm(e.name).indexOf(nq)>=0);
    if(hit) return hit;
  }
  return null;
}

document.getElementById("settings-btn").onclick = ()=> openSettingsSheet(false);

/* ジムで電波が弱いと取得に失敗するので、通信のあるうちに先に読み込んでおく。
   端末に読み取り機能が内蔵されている場合（Android等）は不要なので何もしない。 */
setTimeout(()=>{
  if(!("BarcodeDetector" in window)){ loadJsQR().catch(()=>{}); }
}, 4000);

/* ============================================================
   QRスキャナ（マシンに貼ったQRをアプリ内から読む）
   ・Android/Chrome : 端末内蔵の BarcodeDetector を使う（速い）
   ・iPhone/Safari  : BarcodeDetector が無いので jsQR を読み込んで解析
   ・どちらも駄目な場合は端末のカメラアプリを使うよう案内する
   ============================================================ */
let scanState = { stream:null, raf:null, active:false };

function stopScanner(){
  scanState.active = false;
  if(scanState.raf) cancelAnimationFrame(scanState.raf);
  if(scanState.stream){ scanState.stream.getTracks().forEach(t=> t.stop()); }
  scanState.stream = null; scanState.raf = null;
}

/* 読み取りライブラリの取得。
   配信元が1つだと落ちたときに使えなくなるので、候補を順に試す。   */
const JSQR_SOURCES = [
  "https://cdn.jsdelivr.net/npm/jsqr@1.4.0",
  "https://unpkg.com/jsqr@1.4.0",
  "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
];
function loadOne(url){
  return new Promise((res, rej)=>{
    const sc = document.createElement("script");
    let done = false;
    const finish = (ok)=>{
      if(done) return; done = true;
      clearTimeout(tm);
      if(ok && window.jsQR) res(window.jsQR); else rej(new Error(url));
    };
    const tm = setTimeout(()=> finish(false), 8000);   // 電波が悪い時に固まらないように
    sc.src = url;
    sc.async = true;
    sc.onload  = ()=> finish(true);
    sc.onerror = ()=> finish(false);
    document.head.appendChild(sc);
  });
}
async function loadJsQR(){
  if(window.jsQR) return window.jsQR;
  for(let i=0; i<JSQR_SOURCES.length; i++){
    try{ return await loadOne(JSQR_SOURCES[i]); }
    catch(e){ /* 次の候補へ */ }
  }
  throw new Error("読み取り機能を取得できませんでした");
}

async function openScanner(){
  const sheet = document.getElementById("sheet");
  sheet.innerHTML =
    '<h2>QRを読み取る</h2>'+
    '<div class="scan-box"><video id="scan-video" playsinline muted></video><div class="scan-frame"></div></div>'+
    '<p class="scan-msg" id="scan-msg">マシンに貼ってあるQRコードを枠に入れてください</p>'+
    '<div class="sheet-btns"><button class="btn ghost" id="scan-close">閉じる</button></div>';
  showSheet();
  const msg = document.getElementById("scan-msg");
  document.getElementById("scan-close").onclick = ()=>{ stopScanner(); hideSheet(); };

  const video = document.getElementById("scan-video");
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:"environment"} }, audio:false
    });
  }catch(e){
    msg.innerHTML = 'カメラを使えませんでした。<br>端末の設定でカメラを許可するか、'+
                    '<b>スマホのカメラアプリでQRを読み取って</b>ください（同じように開きます）。';
    msg.className = "scan-msg err";
    return;
  }
  scanState.stream = stream; scanState.active = true;
  video.srcObject = stream;
  video.setAttribute("playsinline","");
  try{ await video.play(); }catch(e){}

  /* 読み取り方式を決める */
  let detector = null, jsqr = null;
  if("BarcodeDetector" in window){
    try{
      const fmts = await window.BarcodeDetector.getSupportedFormats();
      if(fmts.indexOf("qr_code")>=0) detector = new window.BarcodeDetector({formats:["qr_code"]});
    }catch(e){}
  }
  if(!detector){
    msg.textContent = "読み取りの準備をしています…（初回だけ数秒かかります）";
    try{ jsqr = await loadJsQR(); }
    catch(e){
      stopScanner();
      msg.innerHTML = '読み取り機能を取得できませんでした。通信環境をご確認ください。<br>'+
                      'すぐ使いたいときは <b>スマホのカメラアプリでQRを読み取って</b>ください（同じように開きます）。';
      msg.className = "scan-msg err";
      return;
    }
    if(!scanState.active) return;    // 準備中に閉じられた場合
    msg.textContent = "マシンに貼ってあるQRコードを枠に入れてください";
  }

  const cv = document.createElement("canvas");
  const cx = cv.getContext("2d", {willReadFrequently:true});

  async function tick(){
    if(!scanState.active) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      let raw = null;
      try{
        if(detector){
          const found = await detector.detect(video);
          if(found && found.length) raw = found[0].rawValue;
        }else{
          const w = video.videoWidth, h = video.videoHeight;
          if(w && h){
            const scale = Math.min(1, 640/Math.max(w,h));
            cv.width = Math.round(w*scale); cv.height = Math.round(h*scale);
            cx.drawImage(video, 0, 0, cv.width, cv.height);
            const img = cx.getImageData(0,0,cv.width,cv.height);
            const r = jsqr(img.data, img.width, img.height, {inversionAttempts:"dontInvert"});
            if(r && r.data) raw = r.data;
          }
        }
      }catch(e){}
      if(raw){ handleScan(raw, msg); return; }
    }
    scanState.raf = requestAnimationFrame(tick);
  }
  scanState.raf = requestAnimationFrame(tick);
}

function handleScan(raw, msg){
  /* 読み取ったURLからハッシュ部分だけ取り出して種目を開く */
  let hash = "";
  const i = raw.indexOf("#");
  if(i>=0) hash = raw.slice(i);

  if(!hash){
    msg.innerHTML = 'このQRはトレーニングノートのものではないようです。<br>マシンに貼ってあるQRを読み取ってください。';
    msg.className = "scan-msg err";
    scanState.raf = requestAnimationFrame(()=>{ scanState.active && setTimeout(()=>{ msg.className="scan-msg"; msg.textContent="マシンに貼ってあるQRコードを枠に入れてください"; },1600); });
    scanState.active = true;
    return;
  }
  stopScanner();
  const before = state.ui.currentExId;
  const saved = location.hash;
  try{ location.hash = hash; }catch(e){}
  const ok = openFromHash();
  if(ok){
    hideSheet();
    switchTab("train");
    const ex = state.exercises.find(e=> e.id===state.ui.currentExId);
    if(navigator.vibrate) navigator.vibrate(60);
    toast((ex?ex.name:"種目")+" を開きました");
  }else{
    msg.innerHTML = 'この店舗の種目が見つかりませんでした。<br>店舗の切り替えを確認してください。';
    msg.className = "scan-msg err";
  }
}

      // コピー元の種目をこの店舗でも使えるようにする
      // （フリー/有酸素/ファンクショナルは同じ種目を共有＝記録が繋がる。マシンは別種目として複製）
      let k=0;
      state.exercises.filter(e=> inStore(e, copyFrom)).forEach(ex=>{
        if(SHARED_CATS.indexOf(ex.cat)>=0){
          if(!Array.isArray(ex.stores)) ex.stores=[copyFrom];
          if(ex.stores.indexOf(nid)<0) ex.stores.push(nid);
        }else{
          state.exercises.push({id:"c"+Date.now().toString(36)+(k++), name:ex.name, cat:ex.cat, stores:[nid]});

    document.getElementById("se-del").onclick = ()=>{

      state.stores = state.stores.filter(s=> s.id!==st.id);
      const fallback = state.stores[0].id;
      state.exercises.forEach(ex=>{
        if(!Array.isArray(ex.stores)) return;
        ex.stores = ex.stores.filter(x=> x!==st.id);
        if(!ex.stores.length) ex.stores = [fallback];
      });
      save();
      if(curStore()===st.id) switchStore(fallback); else openStoreSheet();
    };
  }
}

let calCtx = null;   // {target:"train"|"weight", y, m, yearMode}

function openCalendar(target){
  const base = (target==="weight") ? weightDate : viewDate;
  calCtx = {target, y:Number(base.slice(0,4)), m:Number(base.slice(5,7)), yearMode:false};
  renderCalendar();
  showSheet();

/* 記録のある日を集める（カレンダー上に点で表示） */
function datesWithData(target){
  const set = new Set();
  if(target==="weight"){
    state.weights.forEach(w=> set.add(w.date));
  }else{
    Object.keys(state.sessions).forEach(exId=>{
      (state.sessions[exId]||[]).forEach(s=>{ if(hasData(s)) set.add(s.date); });
    });
  }
  return set;
}
function renderCalendar(){
  const sheet = document.getElementById("sheet");
  const {target,y,m} = calCtx;
  const selected = (target==="weight") ? weightDate : viewDate;
  const today = todayStr();
  const marks = datesWithData(target);

  /* --- 年選択モード --- */
  if(calCtx.yearMode){
    const thisY = Number(today.slice(0,4));
    let years = "";
    for(let yy=thisY; yy>=thisY-9; yy--){
      years += '<button class="cal-year'+(yy===y?" active":"")+'" data-y="'+yy+'">'+yy+'年</button>';
    }
    sheet.innerHTML =
      '<h2>年を選ぶ</h2><div class="cal-years">'+years+'</div>'+
      '<div class="sheet-btns"><button class="btn ghost" id="cal-back">戻る</button></div>';
    sheet.querySelectorAll(".cal-year").forEach(b=>{
      b.onclick = ()=>{ calCtx.y = Number(b.dataset.y); calCtx.yearMode=false; renderCalendar(); };
    });
    document.getElementById("cal-back").onclick = ()=>{ calCtx.yearMode=false; renderCalendar(); };
    return;
  }

  /* --- 月表示 --- */
  const first = new Date(y, m-1, 1).getDay();      // 月初の曜日(0=日)
  const days  = new Date(y, m, 0).getDate();        // 月の日数
  const nextDisabled = (y>Number(today.slice(0,4))) ||
                       (y===Number(today.slice(0,4)) && m>=Number(today.slice(5,7)));

  let cells = "";
  for(let i=0;i<first;i++) cells += '<div class="cal-cell empty"></div>';
  for(let d=1; d<=days; d++){
    const ds = ymd(y,m,d);
    const cls = ["cal-cell"];
    if(ds===selected) cls.push("sel");
    if(ds===today)    cls.push("today");
    if(ds>today)      cls.push("future");
    const dot = marks.has(ds) ? '<span class="cal-dot"></span>' : '';
    cells += '<button class="'+cls.join(" ")+'" data-d="'+ds+'"'+(ds>today?' disabled':'')+'>'+d+dot+'</button>';
  }

  sheet.innerHTML =
    '<div class="cal-head">'+
      '<button class="cal-nav" id="cal-prev">‹</button>'+
      '<button class="cal-title" id="cal-title">'+y+'年 '+m+'月 <span class="cal-caret">▾</span></button>'+
      '<button class="cal-nav" id="cal-next"'+(nextDisabled?' disabled':'')+'>›</button>'+
    '</div>'+
    '<div class="cal-wd">'+WD.map((w,i)=>'<span class="'+(i===0?"sun":(i===6?"sat":""))+'">'+w+'</span>').join("")+'</div>'+
    '<div class="cal-grid">'+cells+'</div>'+
    '<div class="sheet-btns">'+
      '<button class="btn ghost" id="cal-close">閉じる</button>'+
      '<button class="btn primary" id="cal-today">今日</button>'+
    '</div>';

  document.getElementById("cal-prev").onclick = ()=>{
    calCtx.m--; if(calCtx.m<1){ calCtx.m=12; calCtx.y--; } renderCalendar();
  };
  document.getElementById("cal-next").onclick = ()=>{
    if(nextDisabled) return;
    calCtx.m++; if(calCtx.m>12){ calCtx.m=1; calCtx.y++; } renderCalendar();
  };
  document.getElementById("cal-title").onclick = ()=>{ calCtx.yearMode=true; renderCalendar(); };
  document.getElementById("cal-close").onclick = hideSheet;
  document.getElementById("cal-today").onclick = ()=> pickDate(today);
  sheet.querySelectorAll(".cal-cell[data-d]").forEach(b=>{
    b.onclick = ()=> pickDate(b.dataset.d);
  });
}

  if(ds > todayStr()) return;
  if(calCtx.target==="weight"){ weightDate = ds; hideSheet(); renderWeight(); }
  else{ viewDate = ds; hideSheet(); renderTrain(); }

/* ============================================================
   バックアップ（書き出し／読み込み）
   ・APIキーは書き出しに含めない（他人に渡っても悪用されないように）
   ・読み込みは中身を検証してから、確認を取って置き換える
   ============================================================ */
const BACKUP_FORMAT = "training-note-backup";

function exportData(){
  const dump = {};
  Object.keys(state).forEach(k=>{ dump[k]=state[k]; });
  const payload = {
    format: BACKUP_FORMAT, formatVersion: 1,
    exportedAt: new Date().toISOString(),
    data: dump
  };
  const txt = JSON.stringify(payload);
  const d = todayStr().replace(/-/g,"");
  const name = "トレーニングノート_"+d+".json";
  try{
    const blob = new Blob([txt], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
    const kb = Math.round(txt.length/1024);
    document.getElementById("bk-note").innerHTML =
      "書き出しました（約"+kb+"KB）。<b>ファイルアプリやメールに保存しておいてください。</b>";
  }catch(e){
    toast("書き出しに失敗しました");
  }
}

function importData(file){
  const note = document.getElementById("bk-note");
  const fr = new FileReader();
  fr.onload = ()=>{
    let p;
    try{ p = JSON.parse(fr.result); }
    catch(e){ if(note) note.innerHTML = '<b style="color:var(--red)">読み込めませんでした。</b>ファイルが壊れているようです。'; return; }

    /* 中身の検証（別のアプリのファイルを読み込んで壊さないように） */
    const d = (p && p.format===BACKUP_FORMAT && p.data) ? p.data : p;
    if(!d || !Array.isArray(d.exercises) || typeof d.sessions !== "object" || d.sessions===null){
      if(note) note.innerHTML = '<b style="color:var(--red)">このアプリのバックアップではないようです。</b>';
      return;
    }
    const exN = d.exercises.length;
    let recN = 0;
    Object.keys(d.sessions).forEach(k=>{ (d.sessions[k]||[]).forEach(x=>{ if(x&&x.date) recN++; }); });
    const wN = Array.isArray(d.weights) ? d.weights.length : 0;
    const when = p.exportedAt ? p.exportedAt.slice(0,10) : "不明";

    if(!confirm(
      "このバックアップを読み込みます。\n\n"+
      "書き出した日: "+when+"\n"+
      "種目 "+exN+"件 / 記録 "+recN+"日分 / 体重 "+wN+"件\n\n"+
      "※ いまこの端末にある記録は置き換わります。\n続けますか？")) return;

    state = d;
    if(!state.ui) state.ui = {};
    state.ui.q = "";
    if(!save()){ if(note) note.innerHTML = '<b style="color:var(--red)">保存できませんでした。</b>容量が足りない可能性があります。'; return; }

    /* 古いバックアップでも今の形式に合わせ直す */
    migratePresets(); migrateStores(); pruneEmptySessions();
    const cur = state.exercises.find(e=> e.id===state.ui.currentExId);
    if(!cur || !inStore(cur)){
      const first = state.exercises.find(e=> inStore(e));
      state.ui.currentExId = first ? first.id : null;
      state.ui.currentArea = first ? first.cat : null;
    }
    save(); hideSheet(); renderTrain(); renderWeight();
    toast("読み込みました");
  };
  fr.onerror = ()=>{ if(note) note.innerHTML = '<b style="color:var(--red)">ファイルを読めませんでした。</b>'; };
  fr.readAsText(file);
}


/* ============================================================
   ホーム画面追加の対応（iOS: apple-touch-icon / Android: manifest）
   アイコンは実行時に描画するので外部ファイル不要
   ============================================================ */
(function setupPWA(){
  try{
    function makeIcon(size){
      const c=document.createElement("canvas"); c.width=c.height=size;
      const g=c.getContext("2d"), r=size*0.23;
      g.fillStyle="#9D4EE8";
      g.beginPath();
      g.moveTo(r,0); g.lineTo(size-r,0); g.quadraticCurveTo(size,0,size,r);
      g.lineTo(size,size-r); g.quadraticCurveTo(size,size,size-r,size);
      g.lineTo(r,size); g.quadraticCurveTo(0,size,0,size-r);
      g.lineTo(0,r); g.quadraticCurveTo(0,0,r,0);
      g.closePath(); g.fill();
      g.fillStyle="#fff";
      const cy=size/2, h=size*0.30, w=size*0.085;
      g.fillRect(size*0.18, cy-h/2, w, h);
      g.fillRect(size*0.30, cy-h*0.36, w, h*0.72);
      g.fillRect(size*0.42, cy-size*0.045, size*0.16, size*0.09);
      g.fillRect(size*0.615, cy-h*0.36, w, h*0.72);
      g.fillRect(size*0.735, cy-h/2, w, h);
      return c.toDataURL("image/png");
    }
    const link = (rel,href,extra)=>{
      const l=document.createElement("link"); l.rel=rel; l.href=href;
      if(extra) Object.keys(extra).forEach(k=> l.setAttribute(k,extra[k]));
      document.head.appendChild(l);
    };
    link("apple-touch-icon", makeIcon(180));   // iOS
    link("icon", makeIcon(192), {sizes:"192x192", type:"image/png"});
    const mf = {
      name:"トレーニングノート", short_name:"筋トレ",
      display:"standalone", orientation:"portrait",
      background_color:"#0D0A12", theme_color:"#0D0A12",
      start_url: location.pathname,
      icons:[
        {src:makeIcon(192), sizes:"192x192", type:"image/png", purpose:"any"},
        {src:makeIcon(512), sizes:"512x512", type:"image/png", purpose:"any"}
      ]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(mf)], {type:"application/manifest+json"}));
    link("manifest", url);                      // Android
  }catch(e){ /* 失敗しても通常のブラウザ利用には影響しない */ }
})();
